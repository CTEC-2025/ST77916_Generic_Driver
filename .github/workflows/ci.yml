name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  core-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile core driver
        run: gcc -std=c99 -Wall -Wextra -Werror -c ST77916.c -o ST77916.o

      - name: Check source line length
        run: |
          awk 'length($0) > 80 { print FILENAME ":" FNR ":" length($0); bad=1 }
          END { exit bad }' DEFS.h ST77916_CFG.h ST77916.h ST77916.c \
          examples/arduino/ST77916_Arduino.ino \
          examples/pic/pic_xc8_spi.c examples/avr/atmega_spi.c \
          examples/attiny/attiny_bitbang_spi.c \
          examples/samd/samd21_sercom_spi.c \
          examples/stm32/stm32_hal_spi.c
